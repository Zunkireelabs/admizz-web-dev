name: Deploy to Production

on:
  push:
    branches: [main]

# Shared with deploy-staging.yml on purpose — see the comment there.
# Stage and main deploy from the SAME VPS folder, so their deploy steps must
# never run concurrently.
concurrency:
  group: admizz-vps-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_FB_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_FB_PIXEL_ID }}
          NEXT_PUBLIC_TAWK_PROPERTY_ID: ${{ secrets.NEXT_PUBLIC_TAWK_PROPERTY_ID }}
          NEXT_PUBLIC_TAWK_WIDGET_ID: ${{ secrets.NEXT_PUBLIC_TAWK_WIDGET_ID }}

  deploy:
    name: Deploy to Production (prod container)
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/zunkireelabs/devprojects/websiteprojects/admizz-devs/admizz-edu-web-dev

            # Same lock file as deploy-staging.yml — only one deploy ever
            # touches this folder at a time.
            flock /tmp/admizz-deploy.lock -c '
              set -e
              git fetch origin
              git checkout -f main
              git reset --hard origin/main
              git clean -fd
              # PRODUCTION chat settings. The site is built on this box from the same folder (and the same
              # .env.local) as staging, and that file holds the STAGING chat addresses. Values set here win over
              # .env.local in a Next.js build, so the live site gets the production widget and inbox.
              # Both are public values (a script address and a public inbox id), not secrets. The two Chatwoot
              # bubble settings are blanked so no staging address is baked into the production site.
              NEXT_PUBLIC_CHAT_WIDGET_SRC=https://edgex.zunkireelabs.com/chat-widget/chat-widget.js \
              NEXT_PUBLIC_CHAT_INBOX_ID=FZ6jxD5QwBKoYCCApoERL4BT \
              NEXT_PUBLIC_CHATWOOT_BASE_URL= \
              NEXT_PUBLIC_CHATWOOT_WEBSITE_TOKEN= \
              ./deploy.sh prod
            '

            echo "Waiting for container to be healthy..."
            sleep 10
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format="{{.State.Health.Status}}" admizz-edu-web-prod 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 2 minutes"
            docker logs admizz-edu-web-prod --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://admizzeducation.com)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Production health check passed (HTTP $HTTP_CODE)"
          else
            echo "Production health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
