services:
  admizz-edu-web-prod:
    build: .
    container_name: admizz-edu-web-prod
    restart: unless-stopped
    networks:
      - hosting
    labels:
      - "traefik.enable=true"
      # Router
      - "traefik.http.routers.admizz-edu-web-prod.rule=Host(`admizzeducation.com`) || Host(`www.admizzeducation.com`)"
      - "traefik.http.routers.admizz-edu-web-prod.entrypoints=websecure"
      - "traefik.http.routers.admizz-edu-web-prod.tls.certresolver=letsencrypt"
      # Service
      - "traefik.http.services.admizz-edu-web-prod.loadbalancer.server.port=80"
      # Middleware: WWW → non-www redirect
      - "traefik.http.middlewares.admizz-edu-web-www-redirect.redirectregex.regex=^https://www\\.admizzeducation\\.com/(.*)"
      - "traefik.http.middlewares.admizz-edu-web-www-redirect.redirectregex.replacement=https://admizzeducation.com/$${1}"
      # Redirect middlewares
      - "traefik.http.middlewares.admizz-prod-trailing-slash.redirectregex.regex=^(https?://[^/]+)/(.+)/$$"
      - "traefik.http.middlewares.admizz-prod-trailing-slash.redirectregex.replacement=$${1}/$${2}"
      - "traefik.http.middlewares.admizz-prod-trailing-slash.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-test-prep.redirectregex.regex=^(https?://[^/]+)/test-preparation$$"
      - "traefik.http.middlewares.admizz-prod-test-prep.redirectregex.replacement=$${1}/test-prep"
      - "traefik.http.middlewares.admizz-prod-test-prep.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-consultation.redirectregex.regex=^(https?://[^/]+)/book-your-free-consultation$$"
      - "traefik.http.middlewares.admizz-prod-consultation.redirectregex.replacement=$${1}/register"
      - "traefik.http.middlewares.admizz-prod-consultation.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-campaign.redirectregex.regex=^(https?://[^/]+)/win-big-campaign$$"
      - "traefik.http.middlewares.admizz-prod-campaign.redirectregex.replacement=$${1}/campaign"
      - "traefik.http.middlewares.admizz-prod-campaign.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-newzealand.redirectregex.regex=^(https?://[^/]+)/study-in-new-zealand-from-nepal$$"
      - "traefik.http.middlewares.admizz-prod-newzealand.redirectregex.replacement=$${1}/study-in-newzealand-from-nepal"
      - "traefik.http.middlewares.admizz-prod-newzealand.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-tag.redirectregex.regex=^(https?://[^/]+)/tag/.*$$"
      - "traefik.http.middlewares.admizz-prod-tag.redirectregex.replacement=$${1}/blogs"
      - "traefik.http.middlewares.admizz-prod-tag.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-author.redirectregex.regex=^(https?://[^/]+)/author/.*$$"
      - "traefik.http.middlewares.admizz-prod-author.redirectregex.replacement=$${1}/blogs"
      - "traefik.http.middlewares.admizz-prod-author.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-blogs-page.redirectregex.regex=^(https?://[^/]+)/blogs/page/.*$$"
      - "traefik.http.middlewares.admizz-prod-blogs-page.redirectregex.replacement=$${1}/blogs"
      - "traefik.http.middlewares.admizz-prod-blogs-page.redirectregex.permanent=false"
      - "traefik.http.middlewares.admizz-prod-floating-btn.redirectregex.regex=^(https?://[^/]+)/e-floating-buttons/.*$$"
      - "traefik.http.middlewares.admizz-prod-floating-btn.redirectregex.replacement=$${1}/"
      - "traefik.http.middlewares.admizz-prod-floating-btn.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-birgunj.redirectregex.regex=^(https?://[^/]+)/study-abroad-from-birgunj$$"
      - "traefik.http.middlewares.admizz-prod-birgunj.redirectregex.replacement=$${1}/birgunj"
      - "traefik.http.middlewares.admizz-prod-birgunj.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-janakpur.redirectregex.regex=^(https?://[^/]+)/study-abroad-from-janakpur$$"
      - "traefik.http.middlewares.admizz-prod-janakpur.redirectregex.replacement=$${1}/janakpur"
      - "traefik.http.middlewares.admizz-prod-janakpur.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-uk-admissions-day.redirectregex.regex=^(https?://[^/]+)/uk-admissions-day$$"
      - "traefik.http.middlewares.admizz-prod-uk-admissions-day.redirectregex.replacement=$${1}/events/uk-admissions-day"
      - "traefik.http.middlewares.admizz-prod-uk-admissions-day.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-admizzion-week.redirectregex.regex=^(https?://[^/]+)/admizzion-week$$"
      - "traefik.http.middlewares.admizz-prod-admizzion-week.redirectregex.replacement=$${1}/events/admizzion-week"
      - "traefik.http.middlewares.admizz-prod-admizzion-week.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-uk-education-expo.redirectregex.regex=^(https?://[^/]+)/events/uk-education-expo$$"
      - "traefik.http.middlewares.admizz-prod-uk-education-expo.redirectregex.replacement=$${1}/events/uk-education-expo-2026"
      - "traefik.http.middlewares.admizz-prod-uk-education-expo.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-find-destination.redirectregex.regex=^(https?://[^/]+)/find-your-destination$$"
      - "traefik.http.middlewares.admizz-prod-find-destination.redirectregex.replacement=$${1}/match-your-destination"
      - "traefik.http.middlewares.admizz-prod-find-destination.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-prod-affiliate-program.redirectregex.regex=^(https?://[^/]+)/affiliate-program(/?(\\?.*)?)?$$"
      - "traefik.http.middlewares.admizz-prod-affiliate-program.redirectregex.replacement=$${1}/affiliate$${3}"
      - "traefik.http.middlewares.admizz-prod-affiliate-program.redirectregex.permanent=true"
      # Chain all middlewares (www-redirect first)
      - "traefik.http.routers.admizz-edu-web-prod.middlewares=admizz-edu-web-www-redirect,admizz-prod-trailing-slash,admizz-prod-test-prep,admizz-prod-consultation,admizz-prod-campaign,admizz-prod-newzealand,admizz-prod-tag,admizz-prod-author,admizz-prod-blogs-page,admizz-prod-floating-btn,admizz-prod-birgunj,admizz-prod-janakpur,admizz-prod-uk-admissions-day,admizz-prod-admizzion-week,admizz-prod-uk-education-expo,admizz-prod-find-destination,admizz-prod-affiliate-program"
      # careers.admizzeducation.com → admizzeducation.com/careers (308)
      - "traefik.http.routers.admizz-careers-subdomain.rule=Host(`careers.admizzeducation.com`)"
      - "traefik.http.routers.admizz-careers-subdomain.entrypoints=websecure"
      - "traefik.http.routers.admizz-careers-subdomain.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admizz-careers-subdomain.service=admizz-edu-web-prod"
      - "traefik.http.middlewares.admizz-careers-subdomain-redirect.redirectregex.regex=^https?://careers\\.admizzeducation\\.com.*"
      - "traefik.http.middlewares.admizz-careers-subdomain-redirect.redirectregex.replacement=https://admizzeducation.com/careers"
      - "traefik.http.middlewares.admizz-careers-subdomain-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.admizz-careers-subdomain.middlewares=admizz-careers-subdomain-redirect"
      # events.admizzeducation.com/* → admizzeducation.com/events/* (308, path-preserving)
      - "traefik.http.routers.admizz-events-subdomain.rule=Host(`events.admizzeducation.com`)"
      - "traefik.http.routers.admizz-events-subdomain.entrypoints=websecure"
      - "traefik.http.routers.admizz-events-subdomain.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admizz-events-subdomain.service=admizz-edu-web-prod"
      - "traefik.http.middlewares.admizz-events-subdomain-redirect.redirectregex.regex=^https?://events\\.admizzeducation\\.com/?(.*)"
      - "traefik.http.middlewares.admizz-events-subdomain-redirect.redirectregex.replacement=https://admizzeducation.com/events/$${1}"
      - "traefik.http.middlewares.admizz-events-subdomain-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.admizz-events-subdomain.middlewares=admizz-events-subdomain-redirect"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  hosting:
    external: true
