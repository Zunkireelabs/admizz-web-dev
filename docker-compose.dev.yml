services:
  admizz-edu-web-dev:
    build: .
    container_name: admizz-edu-web-dev
    restart: unless-stopped
    networks:
      - hosting
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admizz-edu-web-dev.rule=Host(`dev-web.admizzeducation.com`)"
      - "traefik.http.routers.admizz-edu-web-dev.entrypoints=websecure"
      - "traefik.http.routers.admizz-edu-web-dev.tls.certresolver=letsencrypt"
      - "traefik.http.services.admizz-edu-web-dev.loadbalancer.server.port=80"
      # Redirect middlewares
      - "traefik.http.middlewares.admizz-dev-trailing-slash.redirectregex.regex=^(https?://[^/]+)/(.+)/$$"
      - "traefik.http.middlewares.admizz-dev-trailing-slash.redirectregex.replacement=$${1}/$${2}"
      - "traefik.http.middlewares.admizz-dev-trailing-slash.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-test-prep.redirectregex.regex=^(https?://[^/]+)/test-preparation$$"
      - "traefik.http.middlewares.admizz-dev-test-prep.redirectregex.replacement=$${1}/test-prep"
      - "traefik.http.middlewares.admizz-dev-test-prep.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-consultation.redirectregex.regex=^(https?://[^/]+)/book-your-free-consultation$$"
      - "traefik.http.middlewares.admizz-dev-consultation.redirectregex.replacement=$${1}/register"
      - "traefik.http.middlewares.admizz-dev-consultation.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-campaign.redirectregex.regex=^(https?://[^/]+)/win-big-campaign$$"
      - "traefik.http.middlewares.admizz-dev-campaign.redirectregex.replacement=$${1}/campaign"
      - "traefik.http.middlewares.admizz-dev-campaign.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-newzealand.redirectregex.regex=^(https?://[^/]+)/study-in-new-zealand-from-nepal$$"
      - "traefik.http.middlewares.admizz-dev-newzealand.redirectregex.replacement=$${1}/study-in-newzealand-from-nepal"
      - "traefik.http.middlewares.admizz-dev-newzealand.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-tag.redirectregex.regex=^(https?://[^/]+)/tag/.*$$"
      - "traefik.http.middlewares.admizz-dev-tag.redirectregex.replacement=$${1}/blogs"
      - "traefik.http.middlewares.admizz-dev-tag.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-author.redirectregex.regex=^(https?://[^/]+)/author/.*$$"
      - "traefik.http.middlewares.admizz-dev-author.redirectregex.replacement=$${1}/blogs"
      - "traefik.http.middlewares.admizz-dev-author.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-blogs-page.redirectregex.regex=^(https?://[^/]+)/blogs/page/.*$$"
      - "traefik.http.middlewares.admizz-dev-blogs-page.redirectregex.replacement=$${1}/blogs"
      - "traefik.http.middlewares.admizz-dev-blogs-page.redirectregex.permanent=false"
      - "traefik.http.middlewares.admizz-dev-floating-btn.redirectregex.regex=^(https?://[^/]+)/e-floating-buttons/.*$$"
      - "traefik.http.middlewares.admizz-dev-floating-btn.redirectregex.replacement=$${1}/"
      - "traefik.http.middlewares.admizz-dev-floating-btn.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-birgunj.redirectregex.regex=^(https?://[^/]+)/study-abroad-from-birgunj$$"
      - "traefik.http.middlewares.admizz-dev-birgunj.redirectregex.replacement=$${1}/birgunj"
      - "traefik.http.middlewares.admizz-dev-birgunj.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-janakpur.redirectregex.regex=^(https?://[^/]+)/study-abroad-from-janakpur$$"
      - "traefik.http.middlewares.admizz-dev-janakpur.redirectregex.replacement=$${1}/janakpur"
      - "traefik.http.middlewares.admizz-dev-janakpur.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-uk-admissions-day.redirectregex.regex=^(https?://[^/]+)/uk-admissions-day$$"
      - "traefik.http.middlewares.admizz-dev-uk-admissions-day.redirectregex.replacement=$${1}/events/uk-admissions-day"
      - "traefik.http.middlewares.admizz-dev-uk-admissions-day.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-admizzion-week.redirectregex.regex=^(https?://[^/]+)/admizzion-week$$"
      - "traefik.http.middlewares.admizz-dev-admizzion-week.redirectregex.replacement=$${1}/events/admizzion-week"
      - "traefik.http.middlewares.admizz-dev-admizzion-week.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-uk-education-expo.redirectregex.regex=^(https?://[^/]+)/events/uk-education-expo$$"
      - "traefik.http.middlewares.admizz-dev-uk-education-expo.redirectregex.replacement=$${1}/events/uk-education-expo-2026"
      - "traefik.http.middlewares.admizz-dev-uk-education-expo.redirectregex.permanent=true"
      - "traefik.http.middlewares.admizz-dev-find-destination.redirectregex.regex=^(https?://[^/]+)/find-your-destination$$"
      - "traefik.http.middlewares.admizz-dev-find-destination.redirectregex.replacement=$${1}/match-your-destination"
      - "traefik.http.middlewares.admizz-dev-find-destination.redirectregex.permanent=true"
      # Chain all middlewares on router
      - "traefik.http.routers.admizz-edu-web-dev.middlewares=admizz-dev-trailing-slash,admizz-dev-test-prep,admizz-dev-consultation,admizz-dev-campaign,admizz-dev-newzealand,admizz-dev-tag,admizz-dev-author,admizz-dev-blogs-page,admizz-dev-floating-btn,admizz-dev-birgunj,admizz-dev-janakpur,admizz-dev-uk-admissions-day,admizz-dev-admizzion-week,admizz-dev-uk-education-expo,admizz-dev-find-destination"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  hosting:
    external: true
