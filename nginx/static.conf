server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # SEOAI:SECURITY-HEADERS:START
    # SEOAI:SECURITY-HEADERS:END
    # ^ one-time anchor for the Action Center's security-headers generator (server/generators/security-headers.js).
    # This app never writes outside this pair; every add_header line here is drafted and reviewed as a normal PR,
    # never committed directly. Existing per-location headers below are untouched.

    # ── Security headers (shared snippet so location blocks inherit them) ──
    # NOTE: nginx replaces server-level add_header when a location block
    # defines its own.  We repeat them in every location via $sec_headers.
    set $sec_headers "";
    # We use the "always" param so they are sent on every response code.

    # ── Consolidated pages: permanent redirects (301) ──
    # Five near-duplicate consultancy pages were merged so they stop competing
    # with each other in search. Keep these until search engines have updated.
    location ~ ^/(best-education-consultancy-in-nepal|best-education-consultancy-for-study-abroad|study-abroad-consultancy-in-nepal|overseas-education-consultants-in-nepal)(\.html)?/?$ {
        absolute_redirect off;
        return 301 /top-education-consultancy-in-nepal;
    }
    location ~ ^/study-abroad-consultants-in-kathmandu(\.html)?/?$ {
        absolute_redirect off;
        return 301 /education-consultancy-in-kathmandu;
    }

    # ── RSC flight-data for Next.js client-side navigation ──
    # Serve __next.*.txt files with text/x-component MIME type
    location ~ /__next\..+\.txt$ {
        types { }
        default_type text/x-component;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.txt RSC payloads (per-page full RSC data)
    location ~ /index\.txt$ {
        types { }
        default_type text/x-component;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Cache hashed assets (JS/CSS/images) — 1 year ──
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── HTML pages — validate freshness on every request ──
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ =404;
    }

    # ── Static site routing — default ──
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript text/x-component;
}
