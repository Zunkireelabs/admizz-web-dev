server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # SEOAI:SECURITY-HEADERS:START
    # SEOAI:SECURITY-HEADERS:END
    # ^ one-time anchor for the Action Center's security-headers generator (server/generators/security-headers.js).
    # This app never writes outside this pair; every add_header line here is drafted and reviewed as a normal PR,
    # never committed directly. Existing per-location headers below are untouched.

    # ── Security headers (shared snippet so location blocks inherit them) ──
    # NOTE: nginx replaces server-level add_header when a location block
    # defines its own.  We repeat them in every location via $sec_headers.
    set $sec_headers "";
    # We use the "always" param so they are sent on every response code.

    # Content-Security-Policy (ENFORCED). Verified by crawling 62 pages: every outside host that loads
    # a script, style, frame or image is allowed below. If a new third-party tool is added to the site,
    # add its host here or the browser will block it (the console shows "Content Security Policy" errors).
    # To go back to log-only mode, change the header name in the two location blocks to
    # Content-Security-Policy-Report-Only.
    # Hosts: GA4, Facebook Pixel, ICEF badge (script + api2.icef.com data call), YouTube/Google Maps/Instagram/TikTok embeds,
    # the CRM form (edgex.zunkireelabs.com), Supabase, Sanity, Google Fonts, jsDelivr flag icons.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://www-cdn.icef.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://*.googletagmanager.com https://*.icef.com https://www.google.com https://stats.g.doubleclick.net https://www.facebook.com https://connect.facebook.net https://edgex.zunkireelabs.com https://script.google.com https://script.googleusercontent.com https://site.api.espn.com https://cdn.sanity.io https://vd27cmpc.apicdn.sanity.io; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com https://edgex.zunkireelabs.com https://www.instagram.com https://www.tiktok.com https://www.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self' https://edgex.zunkireelabs.com https://script.google.com; frame-ancestors 'self'";

    # ── Consolidated pages: permanent redirects (301) ──
    # Five near-duplicate consultancy pages were merged so they stop competing
    # with each other in search. Keep these until search engines have updated.
    location ~ ^/(best-education-consultancy-in-nepal|best-education-consultancy-for-study-abroad|study-abroad-consultancy-in-nepal|overseas-education-consultants-in-nepal)(\.html)?/?$ {
        absolute_redirect off;
        return 301 /top-education-consultancy-in-nepal;
    }
    location ~ ^/study-abroad-consultants-in-kathmandu(\.html)?/?$ {
        absolute_redirect off;
        return 301 /education-consultancy-in-kathmandu;
    }

    # ── UK / USA duplicate guides merged into the main country pages (301) ──
    # These year-stamped and near-duplicate guides competed with the country pages for the same
    # "study in uk/usa from nepal" searches. Slugs are also in src/data/retired-posts.json.
    location ~ ^/(study-in-the-uk-from-nepal-2026-complete-guide|studying-in-the-uk-from-nepal-2025|study-in-the-uk-after-2-from-nepal-complete-2025-guide)(\.html)?/?$ {
        absolute_redirect off;
        return 301 /study-in-uk-from-nepal;
    }
    location ~ ^/(study-in-usa-with-scholarship-from-nepal-a-complete-guide|study-in-the-usa-for-nepali-students-f-1-visa-scholarships-work-opportunities)(\.html)?/?$ {
        absolute_redirect off;
        return 301 /study-in-usa-from-nepal;
    }

    # ── RSC flight-data for Next.js client-side navigation ──
    # Serve __next.*.txt files with text/x-component MIME type
    location ~ /__next\..+\.txt$ {
        types { }
        default_type text/x-component;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.txt RSC payloads (per-page full RSC data)
    location ~ /index\.txt$ {
        types { }
        default_type text/x-component;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── Cache hashed assets (JS/CSS/images) — 1 year ──
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── HTML pages — validate freshness on every request ──
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ =404;
    }

    # ── Static site routing — default ──
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript text/x-component;
}
